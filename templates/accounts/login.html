{% extends 'base.html' %}{% block title %}Login | ShopSphere{% endblock %}{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Welcome back</h1>{% if login_error %}<div class="alert alert-danger">{{ login_error }}</div>{% endif %}<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label" for="id_username">Username</label><input id="id_username" class="form-control" name="username" value="{{ request.POST.username }}" required autofocus></div><div class="mb-3"><label class="form-label" for="id_password">Password</label><input id="id_password" type="password" class="form-control" name="password" required></div><button class="btn btn-primary w-100">Login</button></form><p class="text-center mt-3 mb-0">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p></div></div></div></div></div>{% endblock %}
